<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Iniciar Sesión - ProSalud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #87CEEB;
      display: flex; align-items: center; justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }
    .tarjeta {
      background: #fff; width: 100%; max-width: 520px; padding: 50px;
      border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }
    h2 { text-align: center; margin: 0 0 30px; }
    input {
      width: 100%; padding: 14px; margin-bottom: 15px; font-size: 16px;
      border: 1px solid #777; border-radius: 6px;
    }
    button {
      width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
      background: #87CEEB; border: none; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #6ec0e3; }
    #mensaje { color: #c0392b; font-size: 14px; text-align: center; min-height: 20px; margin: 0 0 12px; }
    .enlaces { text-align: center; margin-top: 18px; font-size: 14px; }
    .enlaces a { color: #1e4f9c; text-decoration: none; }
    .enlaces a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h2>Iniciar Sesión</h2>

    <input type="email" id="correo" placeholder="Correo electrónico">
    <input type="password" id="contrasena" placeholder="Contraseña">

    <p id="mensaje"></p>
    <button id="btnIngresar">Ingresar</button>

    <div class="enlaces">
      ¿No tienes cuenta? <a href="Paciente.html">Regístrate</a><br><br>
      <a href="../index.html">← Volver al inicio</a>
    </div>
  </div>

  <script>
    const API = 'https://mi-proyecto-y2me.onrender.com';
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('btnIngresar');

    async function iniciarSesion() {
      const correo = document.getElementById('correo').value.trim();
      const contrasena = document.getElementById('contrasena').value;

      if (!correo || !contrasena) {
        mensaje.textContent = 'Escribe tu correo y contraseña';
        return;
      }

      mensaje.style.color = '#555';
      mensaje.textContent = 'Ingresando... (si el servidor estaba dormido puede tardar un poco)';
      boton.disabled = true;

      try {
        const resp = await fetch(`${API}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, contrasena })
        });
        const data = await resp.json();

        if (resp.ok) {
          sessionStorage.setItem('paciente', JSON.stringify(data.paciente));
          window.location.href = 'portal.html';
        } else {
          mensaje.style.color = '#c0392b';
          mensaje.textContent = data.mensaje;
        }
      } catch (error) {
        mensaje.style.color = '#c0392b';
        mensaje.textContent = 'No se pudo conectar con el servidor';
      }
      boton.disabled = false;
    }

    boton.addEventListener('click', iniciarSesion);
    document.getElementById('contrasena').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') iniciarSesion();
    });
  </script>
</body>
</html>
