<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Recepción - ProSalud</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: #333; background: #f2f7fb; }
    .header { background: #87CEEB; display: flex; justify-content: space-between;
              align-items: center; padding: 12px 20px; flex-wrap: wrap; gap: 10px; }
    .logo { background: #1e4f9c; color: #fff; font-weight: bold; padding: 8px 14px; border-radius: 4px; }
    .header button { background: #fff; border: 1px solid #333; padding: 6px 12px;
                     font-weight: bold; cursor: pointer; border-radius: 3px; }
    main { max-width: 1200px; margin: 20px auto; padding: 0 16px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .sub { color: #555; margin: 0 0 20px; }
    .tarjeta { background: #fff; border-radius: 12px; padding: 18px;
               box-shadow: 0 3px 10px rgba(0,0,0,.1); margin-bottom: 20px; }

    .filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
               gap: 12px; align-items: end; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 4px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #999; border-radius: 6px; font-size: 15px; }
    .botones { display: flex; gap: 8px; }
    .botones button { padding: 10px 16px; border: none; border-radius: 8px;
                      font-weight: bold; cursor: pointer; }
    #btnBuscar { background: #87CEEB; }
    #btnLimpiar { background: #ddd; }

    .tabla-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e3e3e3; white-space: nowrap; }
    th { background: #eaf6fc; }
    .vacio { padding: 20px; text-align: center; color: #777; display: none; }
    .total { font-size: 13px; color: #555; margin-bottom: 10px; }
    .btn-reprog { background: #87CEEB; border: none; padding: 7px 12px; border-radius: 6px;
                  font-weight: bold; cursor: pointer; }
    .btn-reprog:disabled { background: #ddd; color: #888; cursor: not-allowed; }
    #avisoGeneral { margin-bottom: 12px; font-size: 14px; min-height: 18px; }
    .ok { color: #1e8e3e; font-weight: bold; }
    .error { color: #c0392b; font-weight: bold; }

    /* Ventana de reprogramación */
    #fondoModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5);
                  align-items: center; justify-content: center; z-index: 1000; padding: 16px; }
    #fondoModal.activo { display: flex; }
    .modal { background: #fff; padding: 24px; border-radius: 14px; width: 100%; max-width: 400px;
             box-shadow: 0 8px 24px rgba(0,0,0,.3); }
    .modal h3 { margin: 0 0 6px; }
    .modal .detalle { color: #555; font-size: 14px; margin-bottom: 14px; }
    .modal .campo { margin-bottom: 12px; }
    .modal .acciones { display: flex; gap: 8px; margin-top: 16px; }
    .modal .acciones button { flex: 1; padding: 11px; border: none; border-radius: 8px;
                              font-weight: bold; cursor: pointer; }
    #btnGuardar { background: #87CEEB; }
    #btnCancelarModal { background: #ddd; }
    #mensajeModal { font-size: 14px; min-height: 18px; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">PRO SALUD</div>
    <button id="btnSalir">Cerrar sesión</button>
  </div>

  <main>
    <h1>Hola, <span id="nombreEmpleado"></span></h1>
    <p class="sub">Recepción: agenda de citas</p>

    <div class="tarjeta">
      <div class="filtros">
        <div><label>Fecha</label><input type="date" id="fFecha"></div>
        <div>
          <label>Estado</label>
          <select id="fEstado">
            <option value="">Todos</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Confirmada">Confirmada</option>
            <option value="Programada">Programada</option>
            <option value="Reprogramada">Reprogramada</option>
            <option value="Atendida">Atendida</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>
        <div><label>Documento del paciente</label><input id="fDocumento" placeholder="Número de documento"></div>
        <div class="botones">
          <button id="btnBuscar">Buscar</button>
          <button id="btnLimpiar">Limpiar</button>
        </div>
      </div>
    </div>

    <div class="tarjeta">
      <div id="avisoGeneral"></div>
      <div class="total" id="total"></div>
      <div class="tabla-wrap">
        <table>
          <thead>
            <tr>
              <th>Fecha</th><th>Hora</th><th>Paciente</th><th>Documento</th>
              <th>Celular</th><th>Servicio</th><th>Médico</th><th>Estado</th>
              <th>Canal</th><th>Acción</th>
            </tr>
          </thead>
          <tbody id="cuerpo"></tbody>
        </table>
      </div>
      <div class="vacio" id="vacio">No hay citas con esos filtros.</div>
    </div>
  </main>

  <!-- Ventana para reprogramar -->
  <div id="fondoModal">
    <div class="modal">
      <h3>Reprogramar cita</h3>
      <div class="detalle" id="detalleCita"></div>

      <div class="campo"><label>Nueva fecha</label><input type="date" id="mFecha"></div>
      <div class="campo"><label>Nueva hora</label><input type="time" id="mHora"></div>
      <div class="campo">
        <label>Motivo del cambio</label>
        <input id="mMotivo" maxlength="200" placeholder="Ej: el paciente pidió otro día">
      </div>
      <div class="campo">
        <label>Canal por el que se pidió</label>
        <select id="mCanal">
          <option value="telefono">Teléfono</option>
          <option value="presencial">Presencial</option>
          <option value="web">Web</option>
        </select>
      </div>

      <div id="mensajeModal"></div>
      <div class="acciones">
        <button id="btnGuardar">Guardar</button>
        <button id="btnCancelarModal">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://mi-proyecto-y2me.onrender.com";

    // Protección: solo recepcionista (empleado) o administrador
    const token = sessionStorage.getItem("token");
    const rol = sessionStorage.getItem("rol");

    if (!token || (rol !== "empleado" && rol !== "administrador")) {
      window.location.href = "login.html";
    }

    const guardado = sessionStorage.getItem("empleado");
    if (guardado) {
      const e = JSON.parse(guardado);
      document.getElementById("nombreEmpleado").textContent = (e.nombres || "").toUpperCase();
    }

    document.getElementById("btnSalir").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "../index.html";
    });

    const cuerpo = document.getElementById("cuerpo");
    const vacio = document.getElementById("vacio");
    const total = document.getElementById("total");
    const avisoGeneral = document.getElementById("avisoGeneral");

    const columnas = ["fecha", "hora", "nombre", "identificacion", "celular",
                      "servicio", "medico", "estado", "canal"];

    // Fecha de hoy (hora de Colombia) para no permitir fechas pasadas
    function hoy() {
      return new Date().toLocaleDateString("en-CA", { timeZone: "America/Bogota" });
    }

    async function cargarCitas() {
      cuerpo.innerHTML = "";
      vacio.style.display = "none";
      total.textContent = "Cargando...";

      const params = new URLSearchParams();
      const fecha = document.getElementById("fFecha").value;
      const estado = document.getElementById("fEstado").value;
      const documento = document.getElementById("fDocumento").value.trim();
      if (fecha) params.append("fecha", fecha);
      if (estado) params.append("estado", estado);
      if (documento) params.append("documento", documento);

      try {
        const respuesta = await fetch(API_URL + "/citas?" + params.toString(), {
          headers: { "Authorization": "Bearer " + token }
        });

        if (respuesta.status === 401) {
          sessionStorage.clear();
          window.location.href = "login.html";
          return;
        }

        const citas = await respuesta.json();

        if (!respuesta.ok) {
          total.textContent = "";
          vacio.textContent = citas.mensaje || "Error al cargar las citas";
          vacio.style.display = "block";
          return;
        }

        total.textContent = citas.length + " cita(s)";

        if (citas.length === 0) {
          vacio.textContent = "No hay citas con esos filtros.";
          vacio.style.display = "block";
          return;
        }

        citas.forEach((cita) => {
          const tr = document.createElement("tr");
          columnas.forEach((campo) => {
            const td = document.createElement("td");
            td.textContent = cita[campo] ?? "";
            tr.appendChild(td);
          });

          // Columna de acción
          const tdAccion = document.createElement("td");
          const boton = document.createElement("button");
          boton.className = "btn-reprog";
          boton.textContent = "Reprogramar";
          if (cita.estado === "Cancelada" || cita.estado === "Atendida") {
            boton.disabled = true;
          }
          boton.addEventListener("click", () => abrirModal(cita));
          tdAccion.appendChild(boton);
          tr.appendChild(tdAccion);

          cuerpo.appendChild(tr);
        });
      } catch (error) {
        total.textContent = "";
        vacio.textContent = "No se pudo conectar con el servidor";
        vacio.style.display = "block";
      }
    }

    // ---- Ventana de reprogramación ----
    const fondoModal = document.getElementById("fondoModal");
    const mensajeModal = document.getElementById("mensajeModal");
    let citaActual = null;

    function abrirModal(cita) {
      citaActual = cita;
      document.getElementById("detalleCita").textContent =
        cita.nombre + " — " + cita.servicio + " — actual: " + cita.fecha + " " + cita.hora;
      document.getElementById("mFecha").min = hoy();
      document.getElementById("mFecha").value = "";
      document.getElementById("mHora").value = "";
      document.getElementById("mMotivo").value = "";
      document.getElementById("mCanal").value = "telefono";
      mensajeModal.textContent = "";
      mensajeModal.className = "";
      fondoModal.classList.add("activo");
    }

    function cerrarModal() {
      fondoModal.classList.remove("activo");
      citaActual = null;
    }

    document.getElementById("btnCancelarModal").addEventListener("click", cerrarModal);

    document.getElementById("btnGuardar").addEventListener("click", async () => {
      const fecha = document.getElementById("mFecha").value;
      const hora = document.getElementById("mHora").value;
      const motivo = document.getElementById("mMotivo").value.trim();
      const canal = document.getElementById("mCanal").value;

      if (!fecha || !hora || !motivo) {
        mensajeModal.className = "error";
        mensajeModal.textContent = "Completa la fecha, la hora y el motivo.";
        return;
      }

      const botonGuardar = document.getElementById("btnGuardar");
      botonGuardar.disabled = true;
      mensajeModal.className = "";
      mensajeModal.textContent = "Guardando...";

      try {
        const respuesta = await fetch(API_URL + "/citas/" + citaActual.id_cita + "/reprogramar", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify({ fecha, hora, motivo, canal })
        });
        const resultado = await respuesta.json();

        if (respuesta.ok) {
          cerrarModal();
          avisoGeneral.className = "ok";
          avisoGeneral.textContent = resultado.mensaje;
          cargarCitas();
        } else {
          mensajeModal.className = "error";
          mensajeModal.textContent = resultado.mensaje || "No se pudo reprogramar";
        }
      } catch (error) {
        mensajeModal.className = "error";
        mensajeModal.textContent = "No se pudo conectar con el servidor";
      } finally {
        botonGuardar.disabled = false;
      }
    });

    document.getElementById("btnBuscar").addEventListener("click", cargarCitas);
    document.getElementById("btnLimpiar").addEventListener("click", () => {
      document.getElementById("fFecha").value = "";
      document.getElementById("fEstado").value = "";
      document.getElementById("fDocumento").value = "";
      avisoGeneral.textContent = "";
      cargarCitas();
    });

    cargarCitas();
  </script>
</body>
</html>
