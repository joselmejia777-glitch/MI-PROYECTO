<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Paciente - ProSalud</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
}

/* ================= HEADER ================= */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:skyblue;
    padding:12px 20px;
}

.logo img{
    height:80px;
}

/* MENU */
nav{
    display:flex;
    gap:10px;
}

nav a{
    text-decoration:none;
    background:white;
    color:#333;
    padding:8px 15px;
    border-radius:5px;
    font-weight:bold;
}

nav a:hover{
    background:#e6f2ff;
    color:#0077cc;
}

/* BUSCADOR */
.search button{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:220px;
    padding:10px 15px;
    border:none;
    border-radius:30px;
    background:white;
    font-style:italic;
    font-weight:bold;
    cursor:pointer;
}

.search img{
    height:22px;
}

/* ================= CONTENIDO ================= */
.contenido{
    padding:30px;
}

.titulo{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.formulario{
    max-width:700px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input, select{
    padding:10px;
    border:1px solid gray;
    border-radius:5px;
}

/* PASSWORD */
.campo-password{
    display:flex;
    align-items:center;
    border:1px solid gray;
    border-radius:5px;
    padding:0 10px;
    background:white;
}

.campo-password input{
    border:none;
    outline:none;
    flex:1;
    padding:10px;
}

.campo-password span{
    cursor:pointer;
    font-size:18px;
}

/* CHECKBOX */
.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
}

/* BOTONES */
.botones{
    display:flex;
    gap:20px;
    margin-top:15px;
}

.btn{
    padding:10px 20px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    background:skyblue;
    font-weight:bold;
}

/* ================= ACCESIBILIDAD ================= */
.contenedor-accesibilidad{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    z-index:1000;
}

.contenedor-accesibilidad img{
    width:80px;
    height:auto;
}
.link-azul{
    color:blue;
    cursor:pointer;
    font-weight:bold;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        <img src="../img/Prosalud.png">
    </div>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Nosotros</a>
        <a href="#">Servicios</a>
        <a href="#">Canales de atención</a>
        <a href="#">Transparencia</a>
    </nav>

    <div class="search">
        <button>
            Buscar ...
            <img src="../img/Lupa.PNG">
        </button>
    </div>

</header>

<!-- CONTENIDO -->
<div class="contenido">

    <div class="titulo">Registro de Paciente</div>

    <div class="formulario">

        <select>
            <option>Tipo de documento</option>
            <option>Cédula</option>
            <option>Tarjeta de identidad</option>
            <option>Pasaporte</option>
        </select>

        <input type="text" placeholder="Número de documento">
        <input type="text" placeholder="Nombres">
        <input type="text" placeholder="Apellidos">
        <label for="fecha_nacimiento" style="display:block; margin-bottom:5px; color:red; font-size:30px; background:yellow;">
    PRUEBA 123
</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento"> 


        <select>
            <option>Sexo</option>
            <option>Masculino</option>
            <option>Femenino</option>
        </select>

        <input type="text" placeholder="Teléfono">
        <input type="email" placeholder="Correo Electrónico">
        <input type="text" placeholder="Dirección">

        <select>
            <option>Municipio Atlántico</option>
            <option>Barranquilla</option>
            <option>Soledad</option>
            <option>Malambo</option>
            <option>Galapa</option>
        </select>

        <!-- PASSWORD -->
        <div class="campo-password">
            <input type="password" id="password" placeholder="Contraseña">
            <span onclick="togglePassword('password', this)">👁</span>
        </div>

        <div class="campo-password">
            <input type="password" id="confirmPassword" placeholder="Confirmar Contraseña">
            <span onclick="togglePassword('confirmPassword', this)">👁</span>
        </div>

        <div class="checkbox">
            <input type="checkbox">
            <label>
    Acepto los 
    <span class="link-azul">Términos del servicio</span>, 
    <span class="link-azul">Política de privacidad</span> 
    y <span class="link-azul">Ley de datos personales</span>
</label>
        </div>

        <div class="botones">
            <button class="btn" onclick="registrarPaciente()">
           Registrar Paciente
            </button>
            <button class="btn">Cancelar</button>
        </div>

    </div>

</div>

<!-- ACCESIBILIDAD (SOLO UNA VEZ) -->
<div class="contenedor-accesibilidad" onclick="alert('Opciones de accesibilidad')">
    <img src="../img/Logoayuda.PNG">
</div>
<!-- VENTANA DE REGISTRO EXITOSO -->
<div id="modalRegistro" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
z-index:9999;">

    <div style="
    background:white;
    padding:30px;
    border-radius:10px;
    width:380px;
    text-align:center;
    box-shadow:0 0 20px rgba(0,0,0,.3);">

        <h2 style="color:green;">✔ Registro exitoso</h2>

        <p>
            El paciente fue registrado correctamente.
        </p>

        <button class="btn" onclick="continuar()">
            Continuar
        </button>

    </div>

</div>

<!-- SCRIPT -->
<script>
function togglePassword(id, icon){
    let input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "🙈";
    }else{
        input.type = "password";
        icon.textContent = "👁";
    }
}
function registrarPaciente(){

    alert("✅ Registro exitoso.\n\nEl paciente fue registrado correctamente.");

    window.location.href="citas.html";

}


</script>

</body>
</html>
