<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Paciente - ProSalud</title>

<style>

body{
    margin:0;
    font-family: Arial, sans-serif;
}

/* ================= HEADER ================= */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:skyblue;
    padding:12px 20px;
}

.logo img{
    height:80px;
}

/* MENU */
nav{
    display:flex;
    gap:10px;
}

nav a{
    text-decoration:none;
    background:white;
    color:#333;
    padding:8px 15px;
    border-radius:5px;
    font-weight:bold;
}

nav a:hover{
    background:#e6f2ff;
    color:#0077cc;
}

/* BUSCADOR */
.search button{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:220px;
    padding:10px 15px;
    border:none;
    border-radius:30px;
    background:white;
    font-style:italic;
    font-weight:bold;
    cursor:pointer;
}

.search img{
    height:22px;
}

/* ================= CONTENIDO ================= */
.contenido{
    padding:30px;
}

.titulo{
    text-align:center;
    font-size:22px;
    font-weight:bold;
    margin-bottom:20px;
}

.formulario{
    max-width:700px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input, select{
    padding:10px;
    border:1px solid gray;
    border-radius:5px;
}

/* PASSWORD */
.campo-password{
    display:flex;
    align-items:center;
    border:1px solid gray;
    border-radius:5px;
    padding:0 10px;
    background:white;
}

.campo-password input{
    border:none;
    outline:none;
    flex:1;
    padding:10px;
}

.campo-password span{
    cursor:pointer;
    font-size:18px;
}

/* CHECKBOX */
.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
}

/* BOTONES */
.botones{
    display:flex;
    gap:20px;
    margin-top:15px;
}

.btn{
    padding:10px 20px;
    border:none;
    cursor:pointer;
    border-radius:5px;
    background:skyblue;
    font-weight:bold;
}

/* ================= ACCESIBILIDAD ================= */
.contenedor-accesibilidad{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    z-index:1000;
}

.contenedor-accesibilidad img{
    width:80px;
    height:auto;
}
.link-azul{
    color:blue;
    cursor:pointer;
    font-weight:bold;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>

    <div class="logo">
        <img src="../img/Prosalud.png">
    </div>

    <nav>
        <a href="../index.html">Inicio</a>
        <a href="#">Nosotros</a>
        <a href="#">Servicios</a>
        <a href="#">Canales de atención</a>
        <a href="#">Transparencia</a>
    </nav>

    <div class="search">
        <button>
            Buscar ...
            <img src="../img/Lupa.PNG">
        </button>
    </div>

</header>

<!-- CONTENIDO -->
<div class="contenido">

    <div class="titulo">Registro de Paciente</div>

    <div class="formulario">

        <select id="tipo_documento">
            <option value="">Tipo de documento</option>
            <option value="Cédula">Cédula</option>
            <option value="Tarjeta de identidad">Tarjeta de identidad</option>
            <option value="Pasaporte">Pasaporte</option>
        </select>

        <input type="text" id="numero_documento" placeholder="Número de documento">
        <input type="text" id="nombres" placeholder="Nombres">
        <input type="text" id="apellidos" placeholder="Apellidos">

        <label for="fecha_nacimiento" style="display:block; margin-bottom:5px; color:#555;">
            Fecha de Nacimiento
        </label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">

        <select id="sexo">
            <option value="">Sexo</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
        </select>

        <input type="text" id="telefono" placeholder="Teléfono">
        <input type="email" id="correo" placeholder="Correo Electrónico">
        <input type="text" id="direccion" placeholder="Dirección">

        <select id="municipio">
            <option value="">Municipio Atlántico</option>
            <option value="Barranquilla">Barranquilla</option>
            <option value="Soledad">Soledad</option>
            <option value="Malambo">Malambo</option>
            <option value="Galapa">Galapa</option>
        </select>

        <!-- PASSWORD -->
        <div class="campo-password">
            <input type="password" id="password" placeholder="Contraseña">
            <span onclick="togglePassword('password', this)">👁</span>
        </div>

        <div class="campo-password">
            <input type="password" id="confirmPassword" placeholder="Confirmar Contraseña">
            <span onclick="togglePassword('confirmPassword', this)">👁</span>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="aceptaTerminos">
            <label>
    Acepto los
    <span class="link-azul">Términos del servicio</span>,
    <span class="link-azul">Política de privacidad</span>
    y <span class="link-azul">Ley de datos personales</span>
</label>
        </div>

        <div class="botones">
            <button class="btn" onclick="registrarPaciente()">
           Registrar Paciente
            </button>
            <button class="btn" onclick="window.location.href='citas.html'">Cancelar</button>
        </div>

    </div>

</div>

<!-- ACCESIBILIDAD (SOLO UNA VEZ) -->
<div class="contenedor-accesibilidad" onclick="alert('Opciones de accesibilidad')">
    <img src="../img/Logoayuda.PNG">
</div>

<!-- SCRIPT -->
<script>
function togglePassword(id, icon){
    let input = document.getElementById(id);

    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "🙈";
    }else{
        input.type = "password";
        icon.textContent = "👁";
    }
}

async function registrarPaciente(){

    // Validación básica de contraseñas
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if(password !== confirmPassword){
        alert("⚠️ Las contraseñas no coinciden.");
        return;
    }

    // Recolectar datos del formulario
    const datos = {
        tipo_documento: document.getElementById('tipo_documento').value,
        numero_documento: document.getElementById('numero_documento').value,
        nombres: document.getElementById('nombres').value,
        apellidos: document.getElementById('apellidos').value,
        fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
        sexo: document.getElementById('sexo').value,
        telefono: document.getElementById('telefono').value,
        correo: document.getElementById('correo').value,
        direccion: document.getElementById('direccion').value,
        municipio: document.getElementById('municipio').value,
        contrasena: password
    };

    try{
        const respuesta = await fetch('http://localhost:10000/pacientes', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if(respuesta.ok){
            alert("✅ Registro exitoso.\n\nEl paciente fue registrado correctamente.");
            window.location.href = "citas.html";
        }else{
            alert("❌ Error al registrar: " + resultado.mensaje);
        }

    }catch(error){
        console.error(error);
        alert("❌ No se pudo conectar con el servidor. Verifica que esté corriendo (node app.js) y que MySQL esté encendido en XAMPP.");
    }
}
</script>

</body>
</html>
