<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Médico</title>
<style>
body{
margin:0;
font-family: Arial, sans-serif;
background:white;
}
/* ENCABEZADO */
header{
display:flex;
align-items:center;
justify-content:space-between;
background:skyblue;
padding:12px 20px;
}
.logo img{
height:80px;
}
/* MENÚ CENTRADO */
nav{
flex:1;
display:flex;
justify-content:center;
gap:10px;
}
nav a{
text-decoration:none;
background:white;
padding:8px 12px;
border-radius:5px;
font-weight:bold;
color:#333;
}
nav a:hover{
background:#e6f2ff;
color:#0077cc;
}
/* BUSCADOR HEADER (DERECHA) */
.search{
display:flex;
align-items:center;
gap:8px;
background:white;
padding:6px 10px;
border-radius:25px;
}
.search input{
border:none;
outline:none;
width:140px;
}
.search button{
border:none;
background:none;
cursor:pointer;
}
.search img{
height:18px;
}
/* CONTENIDO */
.contenido{
padding:25px;
}
.titulo{
text-align:center;
font-size:24px;
font-weight:bold;
margin-bottom:8px;
}
.subtitulo{
text-align:center;
font-size:14px;
color:#555;
margin-bottom:20px;
}
.formulario{
max-width:750px;
margin:auto;
display:flex;
flex-direction:column;
gap:12px;
}
label.etiqueta{
font-size:13px;
color:#555;
margin-bottom:-6px;
}
input, select{
padding:10px;
border:1px solid gray;
border-radius:5px;
}
/* PASSWORD */
.campo-password{
display:flex;
align-items:center;
border:1px solid gray;
border-radius:5px;
background:white;
}
.campo-password input{
border:none;
outline:none;
flex:1;
padding:10px;
}
.campo-password span{
padding:0 10px;
cursor:pointer;
}
/* CHECKBOX */
.checkbox{
display:flex;
align-items:center;
gap:10px;
font-size:14px;
}
.link-azul{
color:blue;
font-weight:bold;
cursor:pointer;
}
/* MENSAJE DE RESPUESTA */
#mensaje{
display:none;
padding:10px 12px;
border-radius:5px;
font-size:14px;
font-weight:bold;
}
#mensaje.error{
display:block;
background:#fdecea;
color:#b71c1c;
border:1px solid #f5c6cb;
}
#mensaje.exito{
display:block;
background:#e8f5e9;
color:#1b5e20;
border:1px solid #c3e6cb;
}
/* BOTONES */
.botones{
display:flex;
gap:20px;
margin-top:10px;
}
.btn{
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;
background:skyblue;
font-weight:bold;
}
.btn:disabled{
opacity:0.6;
cursor:not-allowed;
}
.accesibilidad{
position:fixed;
left:20px;
top:50%;
transform:translateY(-50%);
cursor:pointer;
z-index:1000;
}
.accesibilidad img{
width:80px;
height:auto;
}
@media (max-width: 768px) {
    header {
        flex-direction: column;
        gap: 15px;
    }

    nav {
        flex-wrap: wrap;
    }

    .search {
        width: 90%;
    }

    .search input {
        width: 100%;
    }

    .contenido {
        padding: 15px;
    }

    .botones {
        flex-wrap: wrap;
    }

    .accesibilidad img {
        width: 50px;
    }
}
</style>
</head>
<body>
<header>
<div class="logo">
<img src="../img/Prosalud.png">
</div>
<nav>
<a href="../index.html">Inicio</a>
<a href="#">Nosotros</a>
<a href="#">Servicios</a>
<a href="#">Canales</a>
<a href="#">Transparencia</a>
</nav>
<div class="search">
<input type="text" placeholder="Buscar">
<button>
<img src="../img/Lupa.PNG">
</button>
</div>
</header>
<div class="contenido">
<div class="titulo">Registro de Médico</div>
<div class="subtitulo">Usa el mismo documento y correo con los que el administrador te registró.</div>
<form class="formulario" id="formMedico">

<input type="text" id="numero_documento" placeholder="Número de documento" required>
<input type="email" id="correo" placeholder="Correo electrónico" required>

<label class="etiqueta" for="fecha_nacimiento">Fecha de nacimiento</label>
<input type="date" id="fecha_nacimiento" required>

<input type="text" id="telefono" placeholder="Número de teléfono">
<input type="text" id="direccion" placeholder="Dirección de residencia">
<select id="lugar_residencia">
<option value="">Lugar de residencia</option>
<option value="Barranquilla">Barranquilla</option>
<option value="Soledad">Soledad</option>
<option value="Malambo">Malambo</option>
<option value="Galapa">Galapa</option>
</select>

<input type="text" id="usuario" placeholder="Usuario" required>

<div class="campo-password">
<input type="password" id="pass1" placeholder="Contraseña (mínimo 6 caracteres)" required>
<span onclick="toggle('pass1', this)">👁️</span>
</div>
<div class="campo-password">
<input type="password" id="pass2" placeholder="Confirmar contraseña" required>
<span onclick="toggle('pass2', this)">👁️</span>
</div>

<div class="checkbox">
<input type="checkbox" id="acepto">
<label for="acepto">
Acepto los <span class="link-azul">Términos del servicio</span>, <span class="link-azul">Política de privacidad</span> y
<span class="link-azul">Ley de datos personales</span>
</label>
</div>

<div id="mensaje"></div>

<div class="botones">
<button type="submit" class="btn" id="btnRegistrar">Registrar</button>
<button type="button" class="btn" onclick="window.location.href='../index.html'">Cancelar</button>
</div>

</form>

<div class="accesibilidad" onclick="alert('Opciones de accesibilidad')">
<img src="../img/Logoayuda.PNG" alt="Accesibilidad">
</div>
</div>

<script>
// Dirección del servidor. En tu PC usa localhost; al subir a producción se cambia por la de Render.
const API_URL = 'https://mi-proyecto-y2me.onrender.com';

function toggle(id, icon){
    let input = document.getElementById(id);
    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "🙈";
    }else{
        input.type = "password";
        icon.textContent = "👁️";
    }
}

function mostrarMensaje(texto, tipo){
    const caja = document.getElementById('mensaje');
    caja.textContent = texto;
    caja.className = tipo;
}

document.getElementById('formMedico').addEventListener('submit', async function(e){
    e.preventDefault();

    const pass1 = document.getElementById('pass1').value;
    const pass2 = document.getElementById('pass2').value;

    if(pass1.length < 6){
        return mostrarMensaje('La contraseña debe tener mínimo 6 caracteres.', 'error');
    }
    if(pass1 !== pass2){
        return mostrarMensaje('Las contraseñas no coinciden.', 'error');
    }
    if(!document.getElementById('acepto').checked){
        return mostrarMensaje('Debes aceptar los términos y condiciones.', 'error');
    }

    const datos = {
        formulario: 'medico',
        numero_documento: document.getElementById('numero_documento').value.trim(),
        correo: document.getElementById('correo').value.trim(),
        fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
        telefono: document.getElementById('telefono').value.trim(),
        direccion: document.getElementById('direccion').value.trim(),
        lugar_residencia: document.getElementById('lugar_residencia').value,
        usuario: document.getElementById('usuario').value.trim(),
        contrasena: pass1
    };

    const boton = document.getElementById('btnRegistrar');
    boton.disabled = true;
    mostrarMensaje('Enviando...', 'exito');

    try{
        const respuesta = await fetch(API_URL + '/empleados/activar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });

        const resultado = await respuesta.json();

        if(respuesta.ok){
            mostrarMensaje(resultado.mensaje + ' Te llevaremos al inicio de sesión...', 'exito');
            setTimeout(function(){ window.location.href = 'login.html'; }, 8000);
        }else{
            mostrarMensaje(resultado.mensaje || 'No se pudo completar el registro.', 'error');
            boton.disabled = false;
        }
    }catch(error){
        mostrarMensaje('No se pudo conectar con el servidor. Revisa que esté encendido.', 'error');
        boton.disabled = false;
    }
});
</script>
</body>
</html>
