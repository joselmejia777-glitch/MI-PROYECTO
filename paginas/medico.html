<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Médico</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:white;
}

/* ENCABEZADO */
header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:skyblue;
    padding:12px 20px;
}

.logo img{
    height:80px;
}

/* MENÚ CENTRADO */
nav{
    flex:1;
    display:flex;
    justify-content:center;
    gap:10px;
}

nav a{
    text-decoration:none;
    background:white;
    padding:8px 12px;
    border-radius:5px;
    font-weight:bold;
    color:#333;
}

nav a:hover{
    background:#e6f2ff;
    color:#0077cc;
}

/* BUSCADOR HEADER (DERECHA) */
.search{
    display:flex;
    align-items:center;
    gap:8px;
    background:white;
    padding:6px 10px;
    border-radius:25px;
}

.search input{
    border:none;
    outline:none;
    width:140px;
}

.search button{
    border:none;
    background:none;
    cursor:pointer;
}

.search img{
    height:18px;
}

/* CONTENIDO */
.contenido{
    padding:25px;
}

.titulo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:20px;
}

.formulario{
    max-width:750px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
}

input, select{
    padding:10px;
    border:1px solid gray;
    border-radius:5px;
}

/* PASSWORD */
.campo-password{
    display:flex;
    align-items:center;
    border:1px solid gray;
    border-radius:5px;
    background:white;
}

.campo-password input{
    border:none;
    outline:none;
    flex:1;
    padding:10px;
}

.campo-password span{
    padding:0 10px;
    cursor:pointer;
}

/* CHECKBOX */
.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
}

.link-azul{
    color:blue;
    font-weight:bold;
    cursor:pointer;
}

/* BOTONES */
.botones{
    display:flex;
    gap:20px;
    margin-top:10px;
}

.btn{
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:skyblue;
    font-weight:bold;
}
.accesibilidad{
    position:fixed;
    left:20px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    z-index:1000;
}

.accesibilidad img{
    width:80px;
    height:auto;
}

</style>
</head>

<body>

<header>

    <div class="logo">
        <img src="../img/Prosalud.png">
    </div>

    <nav>
        <a href="../index.html">Inicio</a>
        <a href="../Nosotros.html">Nosotros</a>
        <a href="#">Servicios</a>
        <a href="#">Canales</a>
        <a href="#">Transparencia</a>
    </nav>

    <div class="search">
        <input type="text" placeholder="Buscar">
        <button>
            <img src="../img/Lupa.PNG">
        </button>
    </div>

</header>

<div class="contenido">

    <div class="titulo">Registro de Médico</div>

    <div class="formulario">

        <select>
            <option>Tipo de documento</option>
            <option>Cédula</option>
            <option>Tarjeta de identidad</option>
            <option>Pasaporte</option>
        </select>

        <input type="text" placeholder="Número de documento">
        <input type="text" placeholder="Nombres">
        <input type="text" placeholder="Apellidos">

        <select>
            <option>Especialidad</option>
            <option>Medicina General</option>
            <option>Pediatría</option>
            <option>Cardiología</option>
            <option>Dermatología</option>
            <option>Ginecología</option>
        </select>

        <input type="text" placeholder="Número de teléfono">
        <input type="text" placeholder="Dirección de residencia">

        <select>
            <option>Lugar de residencia</option>
            <option>Barranquilla</option>
            <option>Soledad</option>
            <option>Malambo</option>
            <option>Galapa</option>
        </select>

        <input type="text" placeholder="Disponibilidad horaria">
        <input type="text" placeholder="Usuario">

        <div class="campo-password">
            <input type="password" id="pass1" placeholder="Contraseña">
            <span onclick="toggle('pass1', this)">👁</span>
        </div>

        <div class="campo-password">
            <input type="password" id="pass2" placeholder="Confirmar contraseña">
            <span onclick="toggle('pass2', this)">👁</span>
        </div>

        <div class="checkbox">
            <input type="checkbox">
            <label>
                Acepto los <span class="link-azul">Términos del servicio</span>, 
                <span class="link-azul">Política de privacidad</span> y 
                <span class="link-azul">Ley de datos personales</span>
            </label>
        </div>

        <div class="botones">
            <button class="btn">Registrar</button>
            <button class="btn">Cancelar</button>
        </div>
        <div class="accesibilidad" onclick="alert('Opciones de accesibilidad')">
    <img src="../img/Logoayuda.PNG" alt="Accesibilidad">
</div>

</div>

<script>
function toggle(id, icon){
    let input = document.getElementById(id);
    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "🙈";
    }else{
        input.type = "password";
        icon.textContent = "👁";
    }
}
</script>

</body>
</html>
