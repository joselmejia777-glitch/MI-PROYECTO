<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Asignación de Citas</title>

<!--CSS -->
<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    margin: 0;
}

/* CONTENEDOR */
.container {
    width: 80%;
    margin: 30px auto;
}

/* TABS */
.tabs {
    display: flex;
}

.tab {
    padding: 10px 20px;
    border: 1px solid #999;
    background-color: #ddd;
}

.tab.active {
    background-color: skyblue;
}

/* CAJAS */
.box {
    border: 1px solid #999;
    padding: 20px;
    margin-top: 15px;
    background-color: white;
}

.box h3 {
    margin-top: 0;
    color: #2c5d8a;
}

/* FILAS */
.row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

/* CAMPOS */
input, select {
    padding: 8px;
    width: 250px;
}

/* BOTONES */
.btn {
    background-color: skyblue;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: bold;
}

.btn:hover {
    background-color: deepskyblue;
}

/* LOGO IZQUIERDA */
.logo-lateral {
    position: fixed;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
}

.logo-lateral img {
    width: 50px;
}

.tab {
  flex: 1;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  background: white;
  border-right: 1px solid #ddd;
  transition: 0.3s;
  font-weight: bold;
}

.tab:hover {
  background: #e6f2ff;
  color: #0077cc;
}

.tab.active {
  background: #e6f2ff;
  color: #0077cc;
  border-bottom: 3px solid #0077cc;
}

form {
  width: 300px;
  margin-top: 20px;
}

form input {
  width: 100%;
  padding: 10px;
  margin: 5px 0;
}

form button {
  width: 100%;
  padding: 10px;
  background: #0077cc;
  color: white;
  border: none;
  cursor: pointer;
}

form button:hover {
  background: #005fa3;
}
</style>

</head>

<!--HTML -->
<body>

<!-- LOGO -->
<body>

<!-- LOGO -->
<div class="logo-lateral">
    <img src="../img/Logoayuda.PNG">
</div>

<div class="container">

    <div class="tabs">
    <div class="tab" onclick="mostrarSeccion('asignacion')">Asignación de citas</div>
    <div class="tab" onclick="mostrarSeccion('consulta')">Consulta y Cancelación</div>
    <div class="tab" onclick="irAPagos()">Pagos</div>
</div>

    <div id="asignacion">
    <!-- TODO lo que ya hiciste de asignar citas -->
</div>

<div id="consulta" style="display:none;">
    <h3>Resultado de Lista de Citas</h3>

    <table border="1" cellpadding="10">
        <tr>
            <th>Fecha-Hora</th>
            <th>Servicio</th>
            <th>Acción</th>
        </tr>

        <tr>
            <td>22/12/2026 11:30</td>
            <td>Medicina General</td>
            <td>
                <button onclick="cancelarCita()">CANCELAR</button>
            </td>
        </tr>
    </table>
</div>

<div id="pagos" style="display:none;">
    <h3>Pagos</h3>
    <p>Aquí irían los pagos</p>
</div>

    <div class="box">
        <h3>Información del afiliado</h3>

        <div class="row">
            <div>
                <label>Identificación</label><br>
                <input type="text">
            </div>

            <div>
                <label>Nombres y Apellidos</label><br>
                <input type="text">
            </div>

            <div>
                <label>Celular</label><br>
                <input type="text">
            </div>
        </div>

        <div class="row">
            <div>
                <label>Correo</label><br>
                <input type="text">
            </div>

            <div style="display:flex; align-items:end;">
                <button class="btn">Actualizar</button>
            </div>
        </div>
    </div>

    <div class="box">
        <h3>Información de Citas</h3>

        <div class="row">
            <div>
                <label>Fecha:</label><br>
                <input type="date" id="fecha"><br><br>

                <label>Servicio</label><br>
                <select>
                    <option>Consulta Medicina General</option>
                    <option>Odontología</option>
                    <option>Laboratorio</option>
                </select>
            </div>

            <div style="display:flex; flex-direction:column; align-items:flex-start;">
                <button class="btn" onclick="mostrarHorarios()">Consultar disponibilidad</button>

                <!-- AQUÍ SOLO UNO (ANTES TENÍAS DOS) -->
                <div id="horarios" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <!-- HISTORIAL -->
    <h3>Mis citas</h3>
    <div id="listaCitas"></div>

</div>

<div id="pagos" class="seccion" style="display:none;">
    <h2>Pasarela de pagos</h2>

    <form>
        <label>Nombre del titular</label>
        <input type="text" placeholder="Ej: Juan Pérez">

        <label>Número de tarjeta</label>
        <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX">

        <label>Fecha de vencimiento</label>
        <input type="month">

        <label>CVV</label>
        <input type="password" placeholder="123">

        <button type="button">Pagar</button>
    </form>
</div>

<!-- SCRIPT -->
<script>

var fechaSeleccionada = "";
var horaSeleccionada = "";

function mostrarHorarios() {

    fechaSeleccionada = document.getElementById("fecha").value;

    if (fechaSeleccionada == "") {
        alert("Selecciona una fecha");
        return;
    }

    document.getElementById("horarios").innerHTML =
        "Horarios para " + fechaSeleccionada + "<br><br>" +
        "<button onclick=\"seleccionarHora('8:00 AM')\">8:00 AM</button> " +
        "<button onclick=\"seleccionarHora('10:00 AM')\">10:00 AM</button> " +
        "<button onclick=\"seleccionarHora('2:00 PM')\">2:00 PM</button>" +
        "<br><br><div id='resultado'></div>";
}

function seleccionarHora(hora) {

    horaSeleccionada = hora;

    document.getElementById("resultado").innerHTML =
        "Hora elegida: " + hora +
        "<br><br><button onclick=\"confirmar()\">Confirmar cita</button>";
}

function confirmar() {

    var lista = document.getElementById("listaCitas");

    lista.innerHTML += "<p>Cita: " + fechaSeleccionada + " a las " + horaSeleccionada + "</p>";

    alert("Cita guardada el " + fechaSeleccionada + " a las " + horaSeleccionada);
}

function mostrarSeccion(seccion) {

    document.getElementById("asignacion").style.display = "none";
    document.getElementById("consulta").style.display = "none";
    document.getElementById("pagos").style.display = "none";

    document.getElementById(seccion).style.display = "block";

    // Quitar activo de todas las pestañas
    let tabs = document.querySelectorAll(".tab");
    tabs.forEach(tab => tab.classList.remove("active"));

    // Activar la pestaña seleccionada
    event.target.classList.add("active");
}

function cancelarCita() {

    var confirmar = confirm("¿Seguro que deseas cancelar la cita?");

    if (confirmar) {
        alert("Cita cancelada");
    }
}

</script>

</body>
</html>

<script>

var fechaSeleccionada = "";
var horaSeleccionada = "";

function mostrarHorarios() {

    fechaSeleccionada = document.getElementById("fecha").value;

    if (fechaSeleccionada == "") {
        alert("Selecciona una fecha");
        return;
    }

    document.getElementById("horarios").innerHTML =
        "Horarios para " + fechaSeleccionada + "<br><br>" +
        "<button onclick=\"seleccionarHora('8:00 AM')\">8:00 AM</button> " +
        "<button onclick=\"seleccionarHora('10:00 AM')\">10:00 AM</button> " +
        "<button onclick=\"seleccionarHora('2:00 PM')\">2:00 PM</button>" +
        "<br><br><div id='resultado'></div>";
}

function seleccionarHora(hora) {

    horaSeleccionada = hora;

    document.getElementById("resultado").innerHTML =
        "Hora elegida: " + hora +
        "<br><br><button onclick=\"confirmar()\">Confirmar cita</button>";
}

function confirmar() {

    var lista = document.getElementById("listaCitas");

    lista.innerHTML +=
    "<p>✅ Cita programada para el <b>" +
    fechaSeleccionada +
    "</b> a las <b>" +
    horaSeleccionada +
    "</b></p>";

    alert("✅ Cita agendada correctamente.");

    window.location.href="../index.html";

}

function irAPagos() {
    window.open("https://www.paypal.com", "_blank");
}

</script>
</body>
</html>
